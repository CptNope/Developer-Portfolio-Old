<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  <!-- Terminal window body -->
  <rect x="32" y="32" width="448" height="448" rx="64" ry="64" fill="#0f0f1a"/>
  <rect x="32" y="32" width="448" height="448" rx="64" ry="64" fill="none" stroke="url(#grad)" stroke-width="12"/>
  <!-- Terminal title bar dots -->
  <circle cx="100" cy="100" r="16" fill="#ef4444" opacity="0.8"/>
  <circle cx="152" cy="100" r="16" fill="#eab308" opacity="0.8"/>
  <circle cx="204" cy="100" r="16" fill="#22c55e" opacity="0.8"/>
  <!-- Divider line under title bar -->
  <line x1="64" y1="140" x2="448" y2="140" stroke="url(#grad)" stroke-width="3" opacity="0.3"/>
  <!-- Prompt symbol > -->
  <text x="72" y="300" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace" font-size="200" font-weight="700" fill="url(#grad)">$</text>
  <!-- Cursor blink line -->
  <rect x="248" y="190" width="18" height="120" rx="4" fill="url(#grad)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Bottom path accent -->
  <text x="72" y="420" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace" font-size="100" font-weight="600" fill="url(#grad)" opacity="0.6">~/JA</text>
</svg>
